name: Verificar compilación estática
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar React y TypeScript
        run: npm run build
      - name: Probar importación de documentos comerciales
        run: npx vitest run src/core/importXlsx.test.ts src/core/importComposite.test.ts
